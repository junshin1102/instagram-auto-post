name: Daily Instagram Post

on:
  # GitHub Actionsのscheduleは15分おきに設定しても数時間単位で発火しないことが
  # 実際に確認されたため、定期実行はこのワークフローではなく、ローカルPCの
  # Windowsタスクスケジューラ(run_post.bat / JunshinInstagramPost_0705,1205,2005)
  # で行っている。このワークフローは手動実行・動作確認用としてのみ残す。
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Ensure ffmpeg is available
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Post to Instagram
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: python post_to_instagram.py

      - name: Notify LINE on workflow-level failure
        if: failure()
        env:
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
        run: |
          if [ -n "$LINE_CHANNEL_ACCESS_TOKEN" ]; then
            curl -s -X POST https://api.line.me/v2/bot/message/broadcast \
              -H "Content-Type: application/json" \
              -H "Authorization: Bearer $LINE_CHANNEL_ACCESS_TOKEN" \
              -d '{"messages":[{"type":"text","text":"⚠️ Instagram自動投稿のワークフローが失敗しました。GitHub ActionsのActionsタブでログを確認してください。"}]}'
          fi
