name: Daily Instagram Post

on:
  schedule:
    # 毎日 7:00 JST (UTC+9) = 22:00 UTC(前日) に実行
    - cron: "0 22 * * *"
    # 毎日 12:00 JST (UTC+9) = 3:00 UTC に実行
    - cron: "0 3 * * *"
    # 毎日 20:00 JST (UTC+9) = 11:00 UTC に実行
    - cron: "0 11 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Post to Instagram
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
        run: python post_to_instagram.py

      - name: Commit posted image + log
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add images/
          if ! git diff --cached --quiet; then
            git commit -m "chore: mark image as posted [skip ci]"
            git push
          else
            echo "No changes to commit."
          fi

      - name: Notify LINE on workflow-level failure
        if: failure()
        env:
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
        run: |
          if [ -n "$LINE_CHANNEL_ACCESS_TOKEN" ]; then
            curl -s -X POST https://api.line.me/v2/bot/message/broadcast \
              -H "Content-Type: application/json" \
              -H "Authorization: Bearer $LINE_CHANNEL_ACCESS_TOKEN" \
              -d '{"messages":[{"type":"text","text":"⚠️ Instagram自動投稿のワークフローが失敗しました。GitHub ActionsのActionsタブでログを確認してください。"}]}'
          fi
