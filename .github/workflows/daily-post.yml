name: Daily Instagram Post

on:
  # GitHub Actionsのscheduleトリガーは発火しないことがあると分かったため使わない。
  # 代わりに、Pythonスクリプト自身が「次の投稿時刻まで待って投稿する」を
  # 繰り返し、実行時間の上限(6時間)が近づいたら自分自身をworkflow_dispatchで
  # 再起動して引き継ぐ、自己継続方式にしている(オーナー承認済み)。
  # concurrencyにより、常に1本のジョブだけが動く。
  workflow_dispatch: {}

concurrency:
  group: daily-post-loop
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Ensure ffmpeg is available
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Run scheduler loop
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          GH_DISPATCH_TOKEN: ${{ secrets.GH_DISPATCH_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: python post_to_instagram.py --loop

      - name: Notify LINE on workflow-level failure
        if: failure()
        env:
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
        run: |
          if [ -n "$LINE_CHANNEL_ACCESS_TOKEN" ]; then
            curl -s -X POST https://api.line.me/v2/bot/message/broadcast \
              -H "Content-Type: application/json" \
              -H "Authorization: Bearer $LINE_CHANNEL_ACCESS_TOKEN" \
              -d '{"messages":[{"type":"text","text":"⚠️ Instagram自動投稿のワークフローが失敗しました。GitHub ActionsのActionsタブでログを確認してください。"}]}'
          fi
